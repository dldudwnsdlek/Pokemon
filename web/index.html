<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이박사의 연구노트</title>
  <!-- 글꼴 (모두 SIL Open Font License, SOURCES.md 참고) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/meadow.css">
</head>
<body>
  <div class="app">
    <!-- 상단 띠: 종이 위 라벨 -->
    <header class="topbar">
      <button class="drawer-btn" id="drawerBtn" aria-controls="dex" aria-expanded="false">도감 색인</button>
      <h1 class="px22 title">이박사의 연구노트</h1>
      <span class="label px14 current" id="currentLabel"></span>
      <span class="label px14 status-tag" id="statusTag">연구노트를 펼치는 중…</span>
    </header>

    <!-- 왼쪽: 도감 색인 -->
    <aside class="dex" id="dex" aria-label="도감 색인">
      <label class="sr-only" for="dexSearch">포켓몬 이름이나 번호로 찾기</label>
      <input id="dexSearch" type="search" placeholder="이름·번호로 찾기" autocomplete="off">
      <ol class="dex-list" id="dexList"></ol>
    </aside>

    <!-- 가운데: 노트 본문 -->
    <main class="notebook">
      <nav class="tabs" role="tablist" aria-label="기능">
        <button role="tab" class="tab" data-tab="chat" aria-selected="true">기록</button>
        <button role="tab" class="tab" data-tab="battle" aria-selected="false">배틀</button>
        <button role="tab" class="tab" data-tab="evolution" aria-selected="false">진화</button>
        <button role="tab" class="tab" data-tab="find" aria-selected="false">찾기</button>
      </nav>

      <div class="sheet">
        <section class="pane" data-pane="chat" role="tabpanel">
          <div class="records" id="records" aria-live="polite"></div>
          <div class="progress-log" id="progressLog" aria-live="polite"></div>
        </section>

        <section class="pane" data-pane="battle" role="tabpanel" hidden>
          <h2 class="px22 underlined">배틀 상성 코치</h2>
          <p class="pane-lead">선택한 포켓몬이 상대를 만나면 유리할까요? 타입 상성 자료를 근거로 판정해요.</p>
          <div class="form-row">
            <label class="label px14" for="oppKind">상대</label>
            <select id="oppKind">
              <option value="pokemon">포켓몬</option>
              <option value="type">타입</option>
            </select>
            <select id="oppPokemon" aria-label="상대 포켓몬"></select>
            <select id="oppType" aria-label="상대 타입" hidden></select>
            <button class="primary" id="battleBtn">상성 보기</button>
          </div>
        </section>

        <section class="pane" data-pane="evolution" role="tabpanel" hidden>
          <h2 class="px22 underlined">진화 안내</h2>
          <p class="pane-lead">레벨·진화의 돌·통신교환처럼 이름만으로는 알 수 없는 진화 조건을 자료에서 찾아 정리해요.</p>
          <div class="evo-strip" id="evoPreview"></div>
          <button class="primary" id="evoBtn">진화 보기</button>
        </section>

        <section class="pane" data-pane="find" role="tabpanel" hidden>
          <h2 class="px22 underlined">이런 포켓몬 찾아줘</h2>
          <form class="form-row" id="findForm">
            <label class="sr-only" for="findInput">찾고 싶은 포켓몬의 조건</label>
            <input id="findInput" maxlength="500" placeholder="예: 물 타입인데 몸무게 100kg 넘는 포켓몬">
            <button class="primary" type="submit">찾아보기</button>
          </form>
          <p class="pencil small" id="findFilters"></p>
          <div class="index-cards" id="findResults"></div>
        </section>
      </div>

      <form class="ask" id="askForm">
        <label class="sr-only" for="askInput">질문</label>
        <input id="askInput" maxlength="500" placeholder="궁금한 걸 적어 주세요" autocomplete="off">
        <button class="primary" type="submit" id="askBtn">기록하기</button>
      </form>

      <!-- 색인 없음·키 없음 안내 카드 (노트 전체를 덮음) -->
      <div class="notice" id="notice" hidden>
        <div class="notice-card">
          <h2 class="px22 underlined" id="noticeTitle">잠깐만요</h2>
          <p id="noticeText"></p>
        </div>
      </div>
    </main>

    <!-- 오른쪽: 참고 카드 -->
    <aside class="refs" id="refs" aria-label="참고 카드">
      <h2 class="label px14 refs-title">참고 카드</h2>
      <div id="refCards"></div>
    </aside>

    <!-- 아래: 풀숲 띠 -->
    <footer class="meadow" id="meadow" aria-label="오늘 풀숲에서 본 친구들">
      <div class="grass-back" aria-hidden="true"></div>
      <span class="hand meadow-note">오늘 풀숲에서 본 친구들</span>
      <div class="stage" id="stage"></div>
      <div class="grass-front" aria-hidden="true"></div>
      <label class="meadow-pause label px14"><input type="checkbox" id="meadowPause"> 풀숲 멈추기</label>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
